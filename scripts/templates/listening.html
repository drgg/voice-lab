<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声线盲听评分</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --card:#fff; --accent:#2563eb; --hy:#be185d; --zt:#dc2626; --done:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --card:#292524; --accent:#60a5fa; --hy:#f472b6; --zt:#f87171; --done:#4ade80; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 8px; max-width:900px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:12px 16px 60px; max-width:980px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:14px 0; }
  .card.complete { border-color:var(--done); }
  .head { display:flex; justify-content:space-between; gap:8px; }
  .lid { font-weight:700; }
  .text { margin:4px 0 10px; }
  .refs { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
  .refs label { font-size:12px; font-weight:600; }
  .refs .hy { color:var(--hy); } .refs .zt { color:var(--zt); }
  audio { width:100%; height:32px; }
  .cand { border-top:1px dashed var(--line); padding:10px 0 4px; display:grid; grid-template-columns:1fr; gap:4px; }
  .cand .lab { font-weight:700; }
  .scales { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; }
  .scale { display:flex; align-items:center; gap:4px; }
  .scale .name { color:var(--muted); margin-right:2px; }
  .scale input { margin:0 1px 0 4px; }
  .ends { color:var(--muted); font-size:12px; }
  @media (max-width:640px) { .refs { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>声线盲听评分</h1>
  <p class="hint">每题先听<b>「…」</b>和<b>「__VOICE__ 参考」</b>，再给每个匿名结果打分：<b>像谁</b>（1 = 完全像__CHAR__ … 5 = 完全像 __VOICE__）、<b>自然度</b>（1 = 很假 … 5 = 像真人录音）、有没有<b>明显瑕疵</b>（电音、破音、读错、杂音）。评分自动保存在本浏览器里。</p>
  <div class="bar">
    <span>进度：<b id="prog">0</b> / <span id="total">0</span> 个结果</span>
    <button class="primary" id="export">导出评分 JSON</button>
  </div>
</header>
<main id="list"></main>
<script>
const ITEMS = __ITEMS__;
const KEY = 'vl_listening_v1';
let res = {};
try { res = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { res = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(res)); } catch (e) {} };
const $ = (s) => document.querySelector(s);
const total = ITEMS.reduce((n, it) => n + it.cands.length, 0);
$('#total').textContent = total;

function scale(name, field, lineId, label, lo, hi) {
  const cur = ((res[lineId] || {})[label] || {})[field];
  let h = `<span class="scale"><span class="name">${name}</span><span class="ends">${lo}</span>`;
  for (let v = 1; v <= 5; v++) {
    h += `<label><input type="radio" name="${lineId}-${label}-${field}" value="${v}" ${cur === v ? 'checked' : ''}>${v}</label>`;
  }
  return h + `<span class="ends">${hi}</span></span>`;
}

function isDone(r) { return r && r.like && r.nat; }

function render() {
  const list = $('#list'); list.innerHTML = '';
  ITEMS.forEach(it => {
    const card = document.createElement('section');
    const doneAll = it.cands.every(c => isDone((res[it.id] || {})[c.label]));
    card.className = 'card' + (doneAll ? ' complete' : '');
    let h = `<div class="head"><span class="lid">${it.id}</span><span class="ends">${doneAll ? '已完成' : ''}</span></div>
      <div class="text"></div>
      <div class="refs"><div><label class="hy">__CHAR__原声</label><audio controls preload="none" src="${it.orig}"></audio></div>
      <div><label class="zt">__VOICE__ 参考</label><audio controls preload="none" src="${it.ref02}"></audio></div></div>`;
    it.cands.forEach(c => {
      const r = (res[it.id] || {})[c.label] || {};
      h += `<div class="cand"><span class="lab">${c.label}</span><audio controls preload="none" src="${c.src}"></audio>
        <div class="scales">${scale('像谁', 'like', it.id, c.label, '__CHAR__', '__VOICE__')}${scale('自然度', 'nat', it.id, c.label, '假', '真')}
        <label class="scale"><input type="checkbox" data-art="${it.id}|${c.label}" ${r.art ? 'checked' : ''}> 有明显瑕疵</label></div></div>`;
    });
    card.innerHTML = h;
    card.querySelector('.text').textContent = it.text;
    card.querySelectorAll('input[type=radio]').forEach(inp => inp.onchange = () => {
      const [lineId, label, field] = inp.name.split('-');
      res[lineId] = res[lineId] || {}; res[lineId][label] = res[lineId][label] || {};
      res[lineId][label][field] = Number(inp.value);
      save(); updateProgress();
      const allDone = it.cands.every(c => isDone((res[it.id] || {})[c.label]));
      card.classList.toggle('complete', allDone);
    });
    card.querySelectorAll('input[data-art]').forEach(inp => inp.onchange = () => {
      const [lineId, label] = inp.dataset.art.split('|');
      res[lineId] = res[lineId] || {}; res[lineId][label] = res[lineId][label] || {};
      res[lineId][label].art = inp.checked;
      save();
    });
    list.appendChild(card);
  });
}
function updateProgress() {
  $('#prog').textContent = ITEMS.reduce((n, it) => n + it.cands.filter(c => isDone((res[it.id] || {})[c.label])).length, 0);
}
$('#export').onclick = () => {
  const blob = new Blob([JSON.stringify(res, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'listening_results.json'; a.click();
};
render(); updateProgress();
</script>
</body>
</html>
